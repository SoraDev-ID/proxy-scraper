name: Automated Proxy Scraper

on:
  workflow_dispatch:
  repository_dispatch:
    types: [update-proxy]
  schedule:
    - cron: '*/20 * * * *'

concurrency:
  group: proxy-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Proxy Scraper
        run: python scraper.py --check --timeout 1.5 --workers 150

      - name: Commit and push changes if updated
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add http.txt socks4.txt socks5.txt last_updated.txt
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan pada iterasi ini."
            exit 0
          fi
          git commit -m "chore(auto-update): sync latest proxies [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            echo "push attempt $i failed, retrying in $((i*5))s"
            sleep $((i*5))
          done
