name: Automated Proxy Scraper

on:
  schedule:
    # Setiap 20 menit — interval realistis yang benar-benar akan dijadwalkan GitHub
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: proxy-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Proxy Scraper
        run: python scraper.py --check --timeout 1.5 --workers 150

      - name: Commit and push changes if updated
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add http.txt socks4.txt socks5.txt last_updated.txt
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan pada iterasi ini."
          else
            git commit -m "chore(auto-update): sync latest proxies [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
